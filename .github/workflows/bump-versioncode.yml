name: Bump Android versionCode

on:
  push:
    branches:
      - Production

permissions:
  contents: write

jobs:
  bump-versioncode:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump versionCode
        run: node scripts/bump-versioncode.js

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No versionCode change detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore: bump android versionCode [skip version]"
          git push